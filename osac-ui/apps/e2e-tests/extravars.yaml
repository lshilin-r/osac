# Seed values for the VMaaS UI tests.
#
# This file is intentionally static for now. A future test-runner script will
# generate or transform it into the environment variables consumed by the
# Playwright tests.

ui_base_url: 'https://osac-ui-osac.apps.ostest.test.metalkube.org'
username: '<keycloak-user>'
# Never store a real password here. Export OSAC_PASSWORD separately.
password: '<provided-separately>'
ignore_https_errors: true

tenant_name: 'tenant1'

instance_type:
  name: 'instance-type-e2e'
  description: 'Instance type created by e2e test'
  vcpus: 4
  memory_gib: 16
  gpu:
    count: 1
    resource_name: 'nvidia.com/A100'
    pci_device_selector: '10DE:20B0'
  lifecycle_actions:
    - 'Deprecate'
    - 'Obsolete'
  delete_state: 'Obsolete'
