# Non-sensitive seed values for the VMaaS UI tests.
#
# The deployment URL and Keycloak credentials must be supplied through
# OSAC_UI_BASE_URL, OSAC_USERNAME, and OSAC_PASSWORD.

tenant_name: 'tenant1'

catalog_item_name: 'catalog-item-e2e'
compute_instance_template: 'osac.templates.ocp_virt_vm'
catalog_item_title: 'CLI catalog item'
catalog_item_description: 'CLI-created catalog item for E2E testing.'

instance_type:
  name: 'instance-type-e2e'
  description: 'Instance type created by e2e test'
  vcpus: 4
  memory_gib: 16
  gpu:
    count: 1
    resource_name: 'nvidia.com/A100'
    pci_device_selector: '10DE:20B0'
  lifecycle_actions:
    - 'Deprecate'
    - 'Obsolete'
    - 'Reactivate'
